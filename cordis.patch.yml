# dsh-boost bundle patch — one insert over the profile root.
#
# Row ids are stable identity in the config tree; a later layer (the user's
# profile cordis.patch.yml, $DSH_HOME/cordis.patch.yml, --patch overlays)
# overrides a row by id.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so the keys below are this profile's complete configuration surface. A
# missing key falls back to the plugin default. All five tool families are
# always configured (`resolveConfig` fills them from defaults), so deleting a
# family here does not disable it: it only restores that family's default
# window. To disable one, raise its `triggerChars` above every receipt (the
# projection byte cap is 256 KiB, so 300000 prevents it from triggering).
#
# The loader pushes top-level `insert` rows into the assembly plan without any
# id/name matching (cordis-plugin-include `applyEntryPatches`); nothing is
# "silently skipped" at load time. The `row.id === entry.options.id &&
# row.name === entry.options.name` equalities are the plugin manager's in-use /
# addressable attribution (dsh-plugin-manager `listPlugins` / `removeBundle`):
# they decide whether a running entry is recognised as this bundle's row and
# can be addressed or removed through the profile patch. The two equalities
# are independent, so `id` and `name` need not match each other; keeping all
# four identical (package name, exported plugin name, row id, row name =
# `dsh-boost`) keeps the row addressable in the management plane.

- insert:
    - id: dsh-boost
      name: 'dsh-boost'
      config:
        projection:
          read:  { triggerChars: 3000, headChars: 2000, tailChars: 500 }
          grep:  { triggerChars: 700,  headChars: 400,  tailChars: 100 }
          glob:  { triggerChars: 700,  headChars: 400,  tailChars: 100 }
          bash:  { triggerChars: 4000, headChars: 2000, tailChars: 500 }
          ssh:   { triggerChars: 2000, headChars: 1200, tailChars: 300 }
        admission: { thresholdTokens: 1024 }
        selector:  { maxTokens: 512 }
        # Receipt distillation (ADR 0001, ticket #10) is off by default: with it
        # off the projection path is byte for byte the 0.2.7 path. `triggerChars:
        # null` uses each family's projection trigger; `route: null` reuses the
        # boundary route the selector inherits (a strong, slow model may be the
        # boundary model, so pin a cheaper one here if that matters).
        distillation:
          enabled: false
          families: ['bash', 'ssh']
          triggerChars: null
          maxOutputTokens: 256
          timeoutMs: 3000
          route: null
        stepsPerTurn: 8
        horizonSteps: 20
        historyTurns: 5