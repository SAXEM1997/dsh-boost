# Release gate.
#
# The repository's live remote is the internal GitLab mirror; this workflow is
# staged for the public GitHub mirror (see the repository field in
# package.json). It runs the same single command a maintainer runs locally:
# `npm publish --dry-run` executes prepublishOnly -> `npm run ci` (typecheck,
# test, clean build) -> `npm run verify:package` (pack, install with
# --ignore-scripts, import/require, tarball manifest).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - run: npm ci
      - run: npm publish --dry-run