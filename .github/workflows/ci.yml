# Release gate.
#
# The repository's live remote is the internal GitLab mirror; this workflow is
# staged for the public GitHub mirror (see the repository field in
# package.json). It runs prepublishOnly's two commands explicitly, in order:
# `npm run ci` (typecheck, tests, clean build) then
# `npm run verify:package -- --prebuilt` (exact tarball allowlist, bundle-patch
# YAML parse, host-version agreement, dist/index.js guard, exports targets,
# install with --ignore-scripts + probe + TypeScript consumer, then a second
# install with lifecycle scripts enabled).
#
# `--prebuilt` is load-bearing. Without it verify:package would build again
# inside its own pack step, so a missing/ghost dist entry introduced after the
# gate's build would be repaired or hidden instead of reported. The order is
# one explicit build (`npm run ci`) -> verify the tree it produced -> publish;
# package.json ships `prepare` -> scripts/prepare-build.mjs, which builds only
# when dist/ or lib/client.js is missing, so `npm publish`'s own pack repairs a
# cold checkout and leaves a verified build alone.
#
# This used to be `npm publish --dry-run`, on the theory that the dry-run was
# the same gate a maintainer runs. It is not: npm runs prepublishOnly first and
# only then checks the registry, so once 0.1.0 exists every run ends in
# `You cannot publish over the previously published versions: 0.1.0` (exit 1)
# after several minutes of green work. The two commands below are exactly what
# prepublishOnly runs; no --force, and nothing is uploaded.
#
# It never publishes: there is no npm publish invocation, no registry token,
# and a `v*` tag does not upload anything. See docs/RELEASE.md §6.
#
# `.npmrc` and the committed lockfile resolve every tarball to
# registry.npmjs.org — the same registry `publishConfig` publishes to. The gate
# below asserts that every `resolved` URL in the lockfile is exactly
# `https://registry.npmjs.org/`: a mirror, any other host, or plain `http://`
# fails, and an empty set fails too (a check that matches nothing must not pass).
# Without that, a rewritten URL can make release checks read a stale `latest`.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Assert every lockfile URL resolves from npmjs over https
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'

          const EXPECTED = 'https://registry.npmjs.org/'
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          const resolved = []

          const walk = (value, path) => {
            if (Array.isArray(value)) {
              value.forEach((item, index) => walk(item, `${path}[${index}]`))
              return
            }
            if (value === null || typeof value !== 'object') return
            for (const [key, child] of Object.entries(value)) {
              if (key === 'resolved' && typeof child === 'string') {
                resolved.push({ path: `${path}.${key}`, url: child })
              } else {
                walk(child, `${path}.${key}`)
              }
            }
          }

          walk(lock, '$')

          const bad = resolved.filter(({ url }) => !url.startsWith(EXPECTED))
          if (bad.length > 0) {
            console.error(`package-lock.json has ${bad.length} resolved URL(s) outside ${EXPECTED}:`)
            for (const { path, url } of bad) console.error(`  ${path}: ${url}`)
            console.error('The release registry is npmjs over https; a mirror, another host, or http:// must not ship.')
            process.exit(1)
          }
          if (resolved.length === 0) {
            console.error('package-lock.json has no `resolved` URLs; refusing to pass a vacuous registry check.')
            process.exit(1)
          }
          console.log(`package-lock.json: all ${resolved.length} resolved URLs are ${EXPECTED}`)
          NODE
      - run: npm ci --registry=https://registry.npmjs.org/
      # The same two commands `prepublishOnly` runs, in the same order. The
      # `--prebuilt` flag is required: it makes the pack step describe the tree
      # `npm run ci` just built instead of rebuilding it (row 9/31, round 4).
      - run: npm run ci && npm run verify:package -- --prebuilt
      # The gate must be able to fail: all twelve check instances get a
      # corrupted tarball here, and each case asserts the specific failure text
      # of its own check.
      - run: npm run verify:negatives
